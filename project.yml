name: HermesVoice
options:
  bundleIdPrefix: br.app.egger
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.8.1"
    CURRENT_PROJECT_VERSION: "37"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: E743636TCJ
    # Hash do commit; sobrescrito no build via xcodebuild GIT_COMMIT=... (fallback "dev")
    GIT_COMMIT: dev
targets:
  HermesVoice:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Hermes Voice
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Para conversar por voz com o Hermes."
        NSSpeechRecognitionUsageDescription: "Para transcrever sua fala durante a conversa."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        GitCommit: "$(GIT_COMMIT)"
        CFBundleURLTypes:
          - CFBundleURLName: br.app.egger.hermesvoice
            CFBundleURLSchemes:
              - hermesvoice
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: br.app.egger.HermesVoice
      INFOPLIST_FILE: Sources/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: HermesVoiceWidgets
        embed: true
    entitlements:
      path: Sources/HermesVoice.entitlements
      properties:
        com.apple.developer.carplay-voice-based-conversation: true
  HermesVoiceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Hermes Voice
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: br.app.egger.HermesVoice.widgets
      INFOPLIST_FILE: Widgets/Info.plist

name: HermesVoice
options:
  bundleIdPrefix: br.app.egger
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.2.10"
    CURRENT_PROJECT_VERSION: "21"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: E743636TCJ
    # Hash do commit; sobrescrito no build via xcodebuild GIT_COMMIT=... (fallback "dev")
    GIT_COMMIT: dev
targets:
  HermesVoice:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Hermes Voice
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Para conversar por voz com o Hermes."
        NSSpeechRecognitionUsageDescription: "Para transcrever sua fala durante a conversa."
        ITSAppUsesNonExemptEncryption: false
        GitCommit: "$(GIT_COMMIT)"
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, voip]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Sources/HermesVoice.entitlements
      properties: {}
